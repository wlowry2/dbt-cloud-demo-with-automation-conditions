[project]
name = "dbt_cloud_demo"
requires-python = ">=3.10,<3.14"
version = "0.1.0"
dependencies = [
    "dagster",
    "dagster-dbt",
    "dbt-duckdb>=1.10.0",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "dbt_cloud_demo/pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dbt_cloud_demo"
registry_modules = [
    "dbt_cloud_demo.components.*",
]


